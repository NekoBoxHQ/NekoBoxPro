name: Detect sing-box Update

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 获取上游 sing-box 最新版本
        run: |
          TAG=$(curl -s https://api.github.com/repos/sagernet/sing-box/releases/latest | grep '"tag_name"' | head -1 | sed 's/.*"tag_name"[[:space:]]*:[[:space:]]*"//;s/".*//')
          echo "UPSTREAM_TAG=${TAG}" >> $GITHUB_ENV

      - name: 获取项目当前使用的 sing-box 版本
        run: |
          CUR=$(curl -s https://raw.githubusercontent.com/NekoBoxHQ/NekoBox/main/go/cmd/nekobox_core/go.mod | grep 'sagernet/sing-box ' | head -1 | awk '{print $2}')
          echo "CURRENT_TAG=${CUR}" >> $GITHUB_ENV

      - name: 比较版本并创建提醒 Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP="${UPSTREAM_TAG#v}"
          CUR="${CURRENT_TAG#v}"
          echo "upstream=${UP} current=${CUR}"
          if [ -z "$UP" ] || [ -z "$CUR" ]; then
            echo "无法获取版本号，跳过"
            exit 0
          fi
          NEWER=$(printf '%s\n' "$UP" "$CUR" | sort -V | tail -1)
          if [ "$NEWER" = "$UP" ] && [ "$UP" != "$CUR" ]; then
            TITLE="sing-box 上游发布新版本 v${UP}（当前 v${CUR}），请安排内核同步"
            EXISTS=$(gh issue list --repo NekoBoxHQ/NekoBox --state open --search "sing-box 上游发布新版本" --json number --jq 'length' || echo 0)
            if [ "$EXISTS" = "0" ]; then
              BODY=$(printf '上游 sing-box（sagernet/sing-box）已发布 v%s，项目当前依赖 v%s。\n\n内核同步步骤：\n1. 升 tag：build.yml 的 SING_BOX_VERSION 改为 v%s\n2. 重打补丁：确认 patches/ 下的补丁仍能干净应用（本地 git apply --check，CI 也会拦）\n3. 本地重编 nekobox_core + 全链路测试（代理连通、协议导入验证）\n4. 协议对齐：若 sing-box 新增协议/参数，补 Bean 导入支持并更新 docs/ProtocolImport.md\n5. 发版：bump NEKO_VERSION → tag → CI 自动构建 → Release\n6. 客户端「检查更新」自动升级' "$UP" "$CUR" "$UP")
              gh issue create --repo NekoBoxHQ/NekoBox --title "$TITLE" --body "$BODY"
              echo "已创建提醒 Issue：$TITLE"
            else
              echo "已存在同类提醒 Issue，跳过"
            fi
          else
            echo "无新版本（项目已是最新）"
          fi
