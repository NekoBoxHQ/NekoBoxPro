name: Build Windows & Linux & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Send the Telegram release notification as a test (no release is created)'
        type: boolean
        default: false

# 默认最小权限；发布所需的 contents: write 仅在具体 job 上提升
permissions:
  contents: read

env:
  NEKO_VERSION: 5.0.16
  SING_BOX_VERSION: v1.14.2
  # 依赖 fork 已公开（GPLv3 源码可得），克隆固定 commit 保证可复现构建
  LIB_NEKO_COMMIT: db371472351d852e203cdb3ee322d086c2b94a61
  SING_BOX_COMMIT: 05366eaf8783c0fe9dc5ee75fb6035745bbf8a8e
  # geo 数据固定版本（官方 release，均附带官方 sha256sum，CI 内强制校验）
  GEOIP_DB_VER: 20260912
  GEOSITE_DB_VER: 20260925013933
  GEOIP_DAT_VER: 202609270006
  GEOSITE_DAT_VER: 20260925234224

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write # 仅发布 GitHub Release 需要
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # 版本号有多个落点：nekoray_version.txt（运行时 NKR_VERSION 宏与 CMake 项目版本的唯一来源）、
      # 本工作流的 NEKO_VERSION（Go ldflags 与 Release 文案）。发版时漏改其中之一会静默发出
      # 版本号自相矛盾的产物，这里直接失败。
      - name: Verify version consistency
        shell: bash
        run: |
          FILE_VER="$(tr -d ' \t\r\n' < nekoray_version.txt)"
          if [ "$FILE_VER" != "${{ env.NEKO_VERSION }}" ]; then
            echo "::error::版本号不一致：nekoray_version.txt='$FILE_VER' 但工作流 NEKO_VERSION='${{ env.NEKO_VERSION }}'"
            exit 1
          fi
          echo "version ok: $FILE_VER"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.5'
          cache: true

      - name: Clone kernel dependencies (libneko & sing-box fork)
        shell: bash
        run: |
          # 依赖 fork 已公开（GPLv3 源码可得），无需凭据，按固定 commit 克隆
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/NekoBoxHQ/libneko.git libneko
          git -C libneko fetch --depth 1 origin "${{ env.LIB_NEKO_COMMIT }}"
          git -C libneko checkout "${{ env.LIB_NEKO_COMMIT }}"
          git clone --depth 1 https://github.com/NekoBoxHQ/sing-box.git sing-box
          git -C sing-box fetch --depth 1 origin "${{ env.SING_BOX_COMMIT }}"
          git -C sing-box checkout "${{ env.SING_BOX_COMMIT }}"

      - name: Download geo data (pinned versions, sha256 verified)
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/deployment/windows64"
          cd "$GITHUB_WORKSPACE/deployment/windows64"
          set -e
          curl -fLso geoip.db "https://github.com/SagerNet/sing-geoip/releases/download/${{ env.GEOIP_DB_VER }}/geoip.db"
          curl -fLso geosite.db "https://github.com/SagerNet/sing-geosite/releases/download/${{ env.GEOSITE_DB_VER }}/geosite.db"
          curl -fLso geoip.dat "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${{ env.GEOIP_DAT_VER }}/geoip.dat"
          curl -fLso geosite.dat "https://github.com/v2fly/domain-list-community/releases/download/${{ env.GEOSITE_DAT_VER }}/dlc.dat"
          curl -fsSL "https://github.com/SagerNet/sing-geoip/releases/download/${{ env.GEOIP_DB_VER }}/geoip.db.sha256sum" -o geoip.db.sha256sum
          curl -fsSL "https://github.com/SagerNet/sing-geosite/releases/download/${{ env.GEOSITE_DB_VER }}/geosite.db.sha256sum" -o geosite.db.sha256sum
          curl -fsSL "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${{ env.GEOIP_DAT_VER }}/geoip.dat.sha256sum" -o geoip.dat.sha256sum
          curl -fsSL "https://github.com/v2fly/domain-list-community/releases/download/${{ env.GEOSITE_DAT_VER }}/dlc.dat.sha256sum" -o geosite.dat.sha256sum
          sed -i 's/dlc\.dat/geosite.dat/' geosite.dat.sha256sum
          # 显式比对摘要，**不使用** sha256sum -c --ignore-missing：
          # --ignore-missing 会让"清单里文件名对不上"的条目被静默忽略而非失败，
          # 一旦上游再次改产物名（本步骤已依赖一次 sed 改名 hack），
          # 强制的 SHA256 校验就会被绕过而构建照常继续。
          verify_geo_sha() { # <本地文件> <sha256sum 文件> <清单中的文件名>
            local file="$1" sumfile="$2" name="$3" want got
            want=$(awk -v n="$name" '$2==n || $2=="*"n {print $1; exit}' "$sumfile")
            if [ -z "$want" ]; then
              echo "::error::$sumfile 中未找到 $name 条目（疑似上游改名，需人工确认后再更新工作流）"
              exit 1
            fi
            got=$(sha256sum "$file" | awk '{print $1}')
            if [ "$want" != "$got" ]; then
              echo "::error::$file SHA256 校验失败：期望 $want 实际 $got"
              exit 1
            fi
            echo "verified: $file"
          }
          verify_geo_sha geoip.db    geoip.db.sha256sum    geoip.db
          verify_geo_sha geosite.db  geosite.db.sha256sum  geosite.db
          verify_geo_sha geoip.dat   geoip.dat.sha256sum   geoip.dat
          verify_geo_sha geosite.dat geosite.dat.sha256sum geosite.dat
          rm -f *.sha256sum

      - name: Build nekobox_core
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/go/cmd/nekobox_core"
          go build -o "$GITHUB_WORKSPACE/deployment/windows64/nekobox_core.exe" \
            -trimpath \
            -ldflags "-w -s -X github.com/matsuridayo/libneko/neko_common.Version_neko=nekoray-${{ env.NEKO_VERSION }} -X github.com/sagernet/sing-box/constant.Version=${{ env.SING_BOX_VERSION }}" \
            -tags "with_clash_api,with_gvisor,with_quic,with_wireguard,with_utls,with_grpc"

      - name: Build sing-box CLI (custom core)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/../sing-box"
          # -trimpath -ldflags "-w -s"：与 nekobox_core 一致，去除路径、DWARF 与符号表
          go build -trimpath -ldflags "-w -s" -o "$GITHUB_WORKSPACE/deployment/windows64/sing-box.exe" ./cmd/sing-box

      - name: Build updater
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/go/cmd/updater"
          go build -trimpath -ldflags "-w -s" -o "$GITHUB_WORKSPACE/deployment/windows64/updater.exe" .

      - name: MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Qt 6.8.3 (MSVC 2022)
        shell: bash
        run: |
          # 固定版本：aqtinstall 未固定时会随时拉取新版，属于 CI 供应链的可变输入
          python -m pip install --quiet "aqtinstall==3.3.0"
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 \
            --outputdir "$GITHUB_WORKSPACE/qt"
          QTP=$(find "$GITHUB_WORKSPACE/qt" -name Qt6Config.cmake -path "*/lib/cmake/Qt6/Qt6Config.cmake" | head -1 | sed 's|/lib/cmake/Qt6/Qt6Config.cmake||')
          if [ -z "$QTP" ]; then echo "QT6 NOT DETECTED, layout:"; find "$GITHUB_WORKSPACE/qt" -maxdepth 3 -type d 2>/dev/null | head -20; exit 1; fi
          echo "Qt6 detected at: $QTP"
          echo "QT_ROOT=$QTP" >> "$GITHUB_ENV"
          echo "$QTP/bin" >> "$GITHUB_PATH"
          echo "Qt6_DIR=$QTP/lib/cmake/Qt6" >> "$GITHUB_ENV"

      - name: Cache deps
        id: deps_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: $GITHUB_WORKSPACE/deps/built
          key: neko-deps-${{ runner.os }}-v2

      # 缓存命中时 Build deps 整步会被跳过，DEPS_ROOT 必须在这里无条件导出，
      # 否则 Configure 步骤拿到空值、构建失败。
      - name: Set DEPS_ROOT
        shell: bash
        run: echo "DEPS_ROOT=$GITHUB_WORKSPACE/deps/built" >> "$GITHUB_ENV"

      - name: Build deps (protobuf / yaml-cpp / zxing-cpp)
        if: steps.deps_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --quiet ninja
          DEPS="$GITHUB_WORKSPACE/deps"
          mkdir -p "$DEPS/src" "$DEPS/built"
          git clone --depth 1 -b v21.12 https://github.com/protocolbuffers/protobuf.git "$DEPS/src/protobuf"
          # tag 可被上游移动，断言实际检出的 commit，防止静默换到被改写的 tag
          [ "$(git -C "$DEPS/src/protobuf" rev-parse HEAD)" = "f0dc78d7e6e331b8c6bb2d5283e06aa26883ca7c" ] || { echo "::error::protobuf v21.12 指向非预期 commit，拒绝继续"; exit 1; }
          cmake -GNinja -S "$DEPS/src/protobuf" -B "$DEPS/build-protobuf" \
            -DCMAKE_INSTALL_PREFIX="$DEPS/built" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -Dprotobuf_MSVC_STATIC_RUNTIME=OFF -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_SHARED_LIBS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$DEPS/build-protobuf" -j2 --target install
          git clone --depth 1 -b yaml-cpp-0.7.0 https://github.com/jbeder/yaml-cpp.git "$DEPS/src/yaml-cpp"
          [ "$(git -C "$DEPS/src/yaml-cpp" rev-parse HEAD)" = "0579ae3d976091d7d664aa9d2527e0d0cff25763" ] || { echo "::error::yaml-cpp 0.7.0 指向非预期 commit，拒绝继续"; exit 1; }
          cmake -GNinja -S "$DEPS/src/yaml-cpp" -B "$DEPS/build-yaml" \
            -DCMAKE_INSTALL_PREFIX="$DEPS/built" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DYAML_CPP_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$DEPS/build-yaml" -j4 --target install
          git clone --depth 1 -b v2.0.0 https://github.com/nu-book/zxing-cpp.git "$DEPS/src/zxing-cpp"
          [ "$(git -C "$DEPS/src/zxing-cpp" rev-parse HEAD)" = "bdb857efae30f5f2abfcf3d626bf1156dc055bae" ] || { echo "::error::zxing-cpp v2.0.0 指向非预期 commit，拒绝继续"; exit 1; }
          cmake -GNinja -S "$DEPS/src/zxing-cpp" -B "$DEPS/build-zxing" \
            -DCMAKE_INSTALL_PREFIX="$DEPS/built" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BLACKBOX_TESTS=OFF
          cmake --build "$DEPS/build-zxing" -j4 --target install

      - name: Configure & build GUI (nekobox.exe)
        shell: bash
        run: |
          mkdir -p build
          cd build
          cmake -GNinja -DQT_VERSION_MAJOR=6 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT;$DEPS_ROOT" -DQt6_DIR="$QT_ROOT/lib/cmake/Qt6" ..
          ninja -j4
          cp NekoBoxPro.exe "$GITHUB_WORKSPACE/deployment/windows64/"

      - name: Deploy Qt runtime (windeployqt)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/deployment/windows64"
          windeployqt --release --no-translations --no-system-d3d-compiler \
            --no-opengl-sw --no-compiler-runtime NekoBoxPro.exe
          cp "$QT_ROOT/translations/qtbase_zh_CN.qm" .

      - name: Package zip (exclude user config)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/deployment/windows64"
          rm -rf config stderr.txt nekoboxpro.png
          "C:/Program Files/7-Zip/7z.exe" a -tzip -mx5 "$GITHUB_WORKSPACE/NekoBoxPro-Windows64.zip" ./*

      - name: Sign release asset (minisign)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          NEKO_MINISIGN_SECRET_KEY: ${{ secrets.NEKO_MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$NEKO_MINISIGN_SECRET_KEY" ]; then
            echo "::error::NEKO_MINISIGN_SECRET_KEY 未配置，禁止发布未签名资产。"
            echo "::error::updater 对无签名更新一律拒绝（fail-closed），发布未签名资产等于发布一个客户端无法自动升级的版本。"
            exit 1
          fi
          # 私钥是更新信任锚，收紧权限并在任何退出路径（含失败中断）清理
          umask 077
          trap 'rm -f /tmp/nekobox.key' EXIT
          printf '%s\n' "$NEKO_MINISIGN_SECRET_KEY" > /tmp/nekobox.key
          cd "$GITHUB_WORKSPACE/go/cmd/signasset"
          go build -o "$GITHUB_WORKSPACE/signasset-bin" .
          cd "$GITHUB_WORKSPACE"
          ./signasset-bin /tmp/nekobox.key NekoBoxPro-Windows64.zip
          rm -f /tmp/nekobox.key signasset-bin*

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nekobox-windows64
          path: |
            NekoBoxPro-Windows64.zip
            NekoBoxPro-Windows64.zip.minisig

      - name: Publish GitHub Release (Windows)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            NekoBoxPro-Windows64.zip
            NekoBoxPro-Windows64.zip.minisig
          body: |
            **NekoBoxPro v${{ env.NEKO_VERSION }}** 已发布 / Released.

            单内核 sing-box 客户端 · 稳定优先 · 最小复杂度

            更新日志 / Changelog: https://github.com/NekoBoxHQ/NekoBoxPro/releases

      - name: Notify Telegram Group
        # 手动触发并勾选 telegram_test 时也发送，用于在不发版的情况下验证消息编码。
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.telegram_test == 'true'
        # 通知只是锦上添花：它失败不该把一次产物已经发布成功的运行染红。
        # v5.0.13 就是这样变红的——两个平台的 Release 都发布成功了。
        continue-on-error: true
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # NOTE: this script is deliberately 100% ASCII (comments included).
          #
          # Root cause of the garbled notification, now pinned down: the `curl`
          # that wins on this runner is the native Windows curl.exe, not Git
          # Bash's MSYS build. When MSYS launches a native program it converts
          # argv to that process's code page, and CP1252 cannot represent CJK, so
          # every Chinese character collapsed to a single '?' -- the message read
          # "NekoBoxPro v5.0.12 ???". The same mismatch showed up from the other
          # side when the body was passed as a file: a POSIX path went to native
          # curl, which could not open it and exited 26.
          #
          # So the body now avoids both the script file and argv:
          #   * it is produced from \xHH byte escapes, so no non-ASCII byte exists
          #     anywhere in this script;
          #   * bash writes it to a file and feeds it to curl over stdin using
          #     `--data-urlencode text@-`, so curl never sees the text, nor a
          #     path, in its argument vector.
          # \xe5\xb7\xb2\xe5\x8f\x91\xe5\xb8\x83 below is the Chinese for "released".
          MSG_FILE="$(mktemp)"
          printf '<b>NekoBoxPro v%s \xe5\xb7\xb2\xe5\x8f\x91\xe5\xb8\x83</b>\n\nsing-box %s\nWindows / Linux\n%s' \
            "${{ env.NEKO_VERSION }}" \
            "${{ env.SING_BOX_VERSION }}" \
            "https://github.com/NekoBoxHQ/NekoBoxPro" > "$MSG_FILE"
          # Self-check: 109 bytes while NEKO_VERSION and SING_BOX_VERSION keep
          # their current lengths. If this number is ever off, the body was already
          # damaged before the request left the runner, so the fault is here and
          # not on Telegram's side.
          echo "telegram message bytes: $(wc -c < "$MSG_FILE")"
          # -sS: stay quiet but still surface errors. It used to be plain -s, so a
          # Telegram API error was swallowed and the step still reported success.
          curl -sS -m 60 --retry 2 --retry-delay 5 -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text@-" \
            -d "parse_mode=HTML" < "$MSG_FILE"
          rm -f "$MSG_FILE"

  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # 仅发布 GitHub Release 需要
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # 版本号有多个落点：nekoray_version.txt（运行时 NKR_VERSION 宏与 CMake 项目版本的唯一来源）、
      # 本工作流的 NEKO_VERSION（Go ldflags 与 Release 文案）。发版时漏改其中之一会静默发出
      # 版本号自相矛盾的产物，这里直接失败。
      - name: Verify version consistency
        shell: bash
        run: |
          FILE_VER="$(tr -d ' \t\r\n' < nekoray_version.txt)"
          if [ "$FILE_VER" != "${{ env.NEKO_VERSION }}" ]; then
            echo "::error::版本号不一致：nekoray_version.txt='$FILE_VER' 但工作流 NEKO_VERSION='${{ env.NEKO_VERSION }}'"
            exit 1
          fi
          echo "version ok: $FILE_VER"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.5'
          cache: true

      - name: Clone kernel dependencies (libneko & sing-box fork)
        shell: bash
        run: |
          # 依赖 fork 已公开（GPLv3 源码可得），无需凭据，按固定 commit 克隆
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/NekoBoxHQ/libneko.git libneko
          git -C libneko fetch --depth 1 origin "${{ env.LIB_NEKO_COMMIT }}"
          git -C libneko checkout "${{ env.LIB_NEKO_COMMIT }}"
          git clone --depth 1 https://github.com/NekoBoxHQ/sing-box.git sing-box
          git -C sing-box fetch --depth 1 origin "${{ env.SING_BOX_COMMIT }}"
          git -C sing-box checkout "${{ env.SING_BOX_COMMIT }}"

      - name: Download geo data (pinned versions, sha256 verified)
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/deployment/linux64"
          cd "$GITHUB_WORKSPACE/deployment/linux64"
          set -e
          curl -fLso geoip.db "https://github.com/SagerNet/sing-geoip/releases/download/${{ env.GEOIP_DB_VER }}/geoip.db"
          curl -fLso geosite.db "https://github.com/SagerNet/sing-geosite/releases/download/${{ env.GEOSITE_DB_VER }}/geosite.db"
          curl -fLso geoip.dat "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${{ env.GEOIP_DAT_VER }}/geoip.dat"
          curl -fLso geosite.dat "https://github.com/v2fly/domain-list-community/releases/download/${{ env.GEOSITE_DAT_VER }}/dlc.dat"
          curl -fsSL "https://github.com/SagerNet/sing-geoip/releases/download/${{ env.GEOIP_DB_VER }}/geoip.db.sha256sum" -o geoip.db.sha256sum
          curl -fsSL "https://github.com/SagerNet/sing-geosite/releases/download/${{ env.GEOSITE_DB_VER }}/geosite.db.sha256sum" -o geosite.db.sha256sum
          curl -fsSL "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${{ env.GEOIP_DAT_VER }}/geoip.dat.sha256sum" -o geoip.dat.sha256sum
          curl -fsSL "https://github.com/v2fly/domain-list-community/releases/download/${{ env.GEOSITE_DAT_VER }}/dlc.dat.sha256sum" -o geosite.dat.sha256sum
          sed -i 's/dlc\.dat/geosite.dat/' geosite.dat.sha256sum
          # 显式比对摘要，**不使用** sha256sum -c --ignore-missing：
          # --ignore-missing 会让"清单里文件名对不上"的条目被静默忽略而非失败，
          # 一旦上游再次改产物名（本步骤已依赖一次 sed 改名 hack），
          # 强制的 SHA256 校验就会被绕过而构建照常继续。
          verify_geo_sha() { # <本地文件> <sha256sum 文件> <清单中的文件名>
            local file="$1" sumfile="$2" name="$3" want got
            want=$(awk -v n="$name" '$2==n || $2=="*"n {print $1; exit}' "$sumfile")
            if [ -z "$want" ]; then
              echo "::error::$sumfile 中未找到 $name 条目（疑似上游改名，需人工确认后再更新工作流）"
              exit 1
            fi
            got=$(sha256sum "$file" | awk '{print $1}')
            if [ "$want" != "$got" ]; then
              echo "::error::$file SHA256 校验失败：期望 $want 实际 $got"
              exit 1
            fi
            echo "verified: $file"
          }
          verify_geo_sha geoip.db    geoip.db.sha256sum    geoip.db
          verify_geo_sha geosite.db  geosite.db.sha256sum  geosite.db
          verify_geo_sha geoip.dat   geoip.dat.sha256sum   geoip.dat
          verify_geo_sha geosite.dat geosite.dat.sha256sum geosite.dat
          rm -f *.sha256sum

      - name: Build nekobox_core
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/go/cmd/nekobox_core"
          go build -o "$GITHUB_WORKSPACE/deployment/linux64/nekobox_core" \
            -trimpath \
            -ldflags "-w -s -X github.com/matsuridayo/libneko/neko_common.Version_neko=nekoray-${{ env.NEKO_VERSION }} -X github.com/sagernet/sing-box/constant.Version=${{ env.SING_BOX_VERSION }}" \
            -tags "with_clash_api,with_gvisor,with_quic,with_wireguard,with_utls,with_grpc"

      - name: Build sing-box CLI (custom core)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/../sing-box"
          # -trimpath -ldflags "-w -s"：与 nekobox_core 一致，去除路径、DWARF 与符号表
          go build -trimpath -ldflags "-w -s" -o "$GITHUB_WORKSPACE/deployment/linux64/sing-box" ./cmd/sing-box

      - name: Build updater
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/go/cmd/updater"
          go build -trimpath -ldflags "-w -s" -o "$GITHUB_WORKSPACE/deployment/linux64/updater" .

      - name: Setup Python 3.12 (for aqtinstall)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Qt 6.7.2 (Linux gcc_64)
        shell: bash
        run: |
          # 固定版本：aqtinstall 未固定时会随时拉取新版，属于 CI 供应链的可变输入
          python -m pip install --quiet "aqtinstall==3.3.0"
          aqt install-qt linux desktop 6.7.2 linux_gcc_64 --outputdir "$GITHUB_WORKSPACE/qt"
          QTP=$(find "$GITHUB_WORKSPACE/qt" -name Qt6Config.cmake -path "*/lib/cmake/Qt6/Qt6Config.cmake" | head -1 | sed 's|/lib/cmake/Qt6/Qt6Config.cmake||')
          if [ -z "$QTP" ]; then echo "QT6 NOT DETECTED, layout:"; find "$GITHUB_WORKSPACE/qt" -maxdepth 3 -type d 2>/dev/null | head -20; exit 1; fi
          echo "Qt6 detected at: $QTP"
          echo "Qt6_DIR=$QTP/lib/cmake/Qt6" >> "$GITHUB_ENV"

      - name: Cache deps
        id: deps_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: $GITHUB_WORKSPACE/deps/built
          key: neko-deps-${{ runner.os }}-v2

      # 缓存命中时 Build deps 整步会被跳过，DEPS_ROOT 必须在这里无条件导出，
      # 否则 Configure 步骤拿到空值、构建失败。
      - name: Set DEPS_ROOT
        shell: bash
        run: echo "DEPS_ROOT=$GITHUB_WORKSPACE/deps/built" >> "$GITHUB_ENV"

      - name: Build deps (protobuf / yaml-cpp / zxing-cpp)
        if: steps.deps_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          DEPS="$GITHUB_WORKSPACE/deps"
          mkdir -p "$DEPS/src" "$DEPS/built"
          git clone --depth 1 -b v21.12 https://github.com/protocolbuffers/protobuf.git "$DEPS/src/protobuf"
          # tag 可被上游移动，断言实际检出的 commit，防止静默换到被改写的 tag
          [ "$(git -C "$DEPS/src/protobuf" rev-parse HEAD)" = "f0dc78d7e6e331b8c6bb2d5283e06aa26883ca7c" ] || { echo "::error::protobuf v21.12 指向非预期 commit，拒绝继续"; exit 1; }
          cmake -GNinja -S "$DEPS/src/protobuf" -B "$DEPS/build-protobuf" \
            -DCMAKE_INSTALL_PREFIX="$DEPS/built" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -Dprotobuf_MSVC_STATIC_RUNTIME=OFF -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_SHARED_LIBS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$DEPS/build-protobuf" -j2 --target install
          git clone --depth 1 -b yaml-cpp-0.7.0 https://github.com/jbeder/yaml-cpp.git "$DEPS/src/yaml-cpp"
          [ "$(git -C "$DEPS/src/yaml-cpp" rev-parse HEAD)" = "0579ae3d976091d7d664aa9d2527e0d0cff25763" ] || { echo "::error::yaml-cpp 0.7.0 指向非预期 commit，拒绝继续"; exit 1; }
          cmake -GNinja -S "$DEPS/src/yaml-cpp" -B "$DEPS/build-yaml" \
            -DCMAKE_INSTALL_PREFIX="$DEPS/built" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DYAML_CPP_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$DEPS/build-yaml" -j4 --target install
          git clone --depth 1 -b v2.0.0 https://github.com/nu-book/zxing-cpp.git "$DEPS/src/zxing-cpp"
          [ "$(git -C "$DEPS/src/zxing-cpp" rev-parse HEAD)" = "bdb857efae30f5f2abfcf3d626bf1156dc055bae" ] || { echo "::error::zxing-cpp v2.0.0 指向非预期 commit，拒绝继续"; exit 1; }
          cmake -GNinja -S "$DEPS/src/zxing-cpp" -B "$DEPS/build-zxing" \
            -DCMAKE_INSTALL_PREFIX="$DEPS/built" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BLACKBOX_TESTS=OFF
          cmake --build "$DEPS/build-zxing" -j4 --target install

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-xv0 libdbus-1-3 libegl1 libfontconfig1 libfreetype6 \
            libglib2.0-0 libharfbuzz0b libx11-6 libx11-xcb1 libxext6 libxfixes3 \
            libxi6 libxrender1 libsm6 libice6 libssl3 libxkbcommon0 libwayland-client0

      - name: Configure & build GUI (nekobox)
        shell: bash
        run: |
          mkdir -p build
          cd build
          cmake -GNinja -DQT_VERSION_MAJOR=6 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR/../../..;$DEPS_ROOT" ..
          ninja -j4
          cp nekoboxpro "$GITHUB_WORKSPACE/deployment/linux64/"

      - name: Stage runtime assets
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/deployment/linux64"
          cp "$GITHUB_WORKSPACE/res/public/nekoboxpro.png" .

      - name: Build AppImage
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          export PATH="$Qt6_DIR/../../../bin:$PATH"
          export QMAKE="$Qt6_DIR/../../../bin/qmake"
          # 固定发布版本 + SHA256 校验。原实现取 `continuous` tag —— 那是可变目标，
          # 上游任何一次推送都会让 CI 下载并执行新的二进制，构成直接的 CI 供应链 RCE 面。
          LD_VER="1-alpha-20251107-1"
          LDQT_VER="1-alpha-20250213-1"
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LD_VER/linuxdeploy-x86_64.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/$LDQT_VER/linuxdeploy-plugin-qt-x86_64.AppImage"
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          printf '[Desktop Entry]\nType=Application\nName=NekoBoxPro\nComment=NekoBoxPro proxy client\nExec=nekoboxpro\nIcon=nekoboxpro\nCategories=Network;Qt;\nTerminal=false\n' > AppDir/usr/share/applications/nekobox.desktop
          cp res/public/nekoboxpro.png AppDir/usr/share/icons/hicolor/256x256/apps/nekoboxpro.png
          # linuxdeploy 只打包 --executable 指定的可执行文件及其共享库依赖（Qt），
          # 不会带上同目录的内核、更新器与 geo 数据。而程序只在
          # applicationDirPath() 下查找 nekobox_core（main/NekoGui.cpp
          # FindNekoBoxCoreRealPath，无 PATH 回退），因此必须显式放入 AppDir/usr/bin ——
          # 否则产出的 AppImage 缺内核，用户「下载直接运行」会无法启动代理。
          mkdir -p AppDir/usr/bin
          cp deployment/linux64/nekobox_core \
             deployment/linux64/sing-box \
             deployment/linux64/updater \
             deployment/linux64/geoip.dat \
             deployment/linux64/geoip.db \
             deployment/linux64/geosite.dat \
             deployment/linux64/geosite.db \
             AppDir/usr/bin/
          export LDAI_OUTPUT="NekoBoxPro-Linux-x64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable deployment/linux64/nekoboxpro \
            --plugin qt \
            --output appimage

      - name: Package tar.gz
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/deployment"
          rm -rf linux64/config
          mv linux64 nekoboxpro
          tar czf "$GITHUB_WORKSPACE/NekoBoxPro-Linux64.tar.gz" nekoboxpro

      - name: Sign release assets (minisign)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          NEKO_MINISIGN_SECRET_KEY: ${{ secrets.NEKO_MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$NEKO_MINISIGN_SECRET_KEY" ]; then
            echo "::error::NEKO_MINISIGN_SECRET_KEY 未配置，禁止发布未签名资产。"
            echo "::error::updater 对无签名更新一律拒绝（fail-closed），发布未签名资产等于发布一个客户端无法自动升级的版本。"
            exit 1
          fi
          # 私钥是更新信任锚，收紧权限并在任何退出路径（含失败中断）清理
          umask 077
          trap 'rm -f /tmp/nekobox.key' EXIT
          printf '%s\n' "$NEKO_MINISIGN_SECRET_KEY" > /tmp/nekobox.key
          cd "$GITHUB_WORKSPACE/go/cmd/signasset"
          go build -o "$GITHUB_WORKSPACE/signasset-bin" .
          cd "$GITHUB_WORKSPACE"
          ./signasset-bin /tmp/nekobox.key NekoBoxPro-Linux-x64.AppImage
          ./signasset-bin /tmp/nekobox.key NekoBoxPro-Linux64.tar.gz
          rm -f /tmp/nekobox.key signasset-bin*

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nekobox-linux64
          path: |
            NekoBoxPro-Linux-x64.AppImage
            NekoBoxPro-Linux-x64.AppImage.minisig
            NekoBoxPro-Linux64.tar.gz
            NekoBoxPro-Linux64.tar.gz.minisig

      - name: Publish GitHub Release (Linux)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            NekoBoxPro-Linux-x64.AppImage
            NekoBoxPro-Linux-x64.AppImage.minisig
            NekoBoxPro-Linux64.tar.gz
            NekoBoxPro-Linux64.tar.gz.minisig
