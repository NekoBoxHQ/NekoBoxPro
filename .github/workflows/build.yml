name: Build Windows & Linux & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 默认最小权限；发布所需的 contents: write 仅在具体 job 上提升
permissions:
  contents: read

env:
  NEKO_VERSION: 5.0.11
  SING_BOX_VERSION: v1.14.2
  # 依赖 fork 已公开（GPLv3 源码可得），克隆固定 commit 保证可复现构建
  LIB_NEKO_COMMIT: db371472351d852e203cdb3ee322d086c2b94a61
  SING_BOX_COMMIT: 05366eaf8783c0fe9dc5ee75fb6035745bbf8a8e
  # geo 数据固定版本（官方 release，均附带官方 sha256sum，CI 内强制校验）
  GEOIP_DB_VER: 20260912
  GEOSITE_DB_VER: 20260925013933
  GEOIP_DAT_VER: 202609270006
  GEOSITE_DAT_VER: 20260925234224

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write # 仅发布 GitHub Release 需要
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.5'
          cache: true

      - name: Clone kernel dependencies (libneko & sing-box fork)
        shell: bash
        run: |
          # 依赖 fork 已公开（GPLv3 源码可得），无需凭据，按固定 commit 克隆
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/NekoBoxHQ/libneko.git libneko
          git -C libneko fetch --depth 1 origin "${{ env.LIB_NEKO_COMMIT }}"
          git -C libneko checkout "${{ env.LIB_NEKO_COMMIT }}"
          git clone --depth 1 https://github.com/NekoBoxHQ/sing-box.git sing-box
          git -C sing-box fetch --depth 1 origin "${{ env.SING_BOX_COMMIT }}"
          git -C sing-box checkout "${{ env.SING_BOX_COMMIT }}"

      - name: Download geo data (pinned versions, sha256 verified)
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/deployment/windows64"
          cd "$GITHUB_WORKSPACE/deployment/windows64"
          set -e
          curl -fLso geoip.db "https://github.com/SagerNet/sing-geoip/releases/download/${{ env.GEOIP_DB_VER }}/geoip.db"
          curl -fLso geosite.db "https://github.com/SagerNet/sing-geosite/releases/download/${{ env.GEOSITE_DB_VER }}/geosite.db"
          curl -fLso geoip.dat "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${{ env.GEOIP_DAT_VER }}/geoip.dat"
          curl -fLso geosite.dat "https://github.com/v2fly/domain-list-community/releases/download/${{ env.GEOSITE_DAT_VER }}/dlc.dat"
          curl -fsSL "https://github.com/SagerNet/sing-geoip/releases/download/${{ env.GEOIP_DB_VER }}/geoip.db.sha256sum" -o geoip.db.sha256sum
          curl -fsSL "https://github.com/SagerNet/sing-geosite/releases/download/${{ env.GEOSITE_DB_VER }}/geosite.db.sha256sum" -o geosite.db.sha256sum
          curl -fsSL "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${{ env.GEOIP_DAT_VER }}/geoip.dat.sha256sum" -o geoip.dat.sha256sum
          curl -fsSL "https://github.com/v2fly/domain-list-community/releases/download/${{ env.GEOSITE_DAT_VER }}/dlc.dat.sha256sum" -o geosite.dat.sha256sum
          sed -i 's/dlc\.dat/geosite.dat/' geosite.dat.sha256sum
          sha256sum -c geoip.db.sha256sum --ignore-missing
          sha256sum -c geosite.db.sha256sum --ignore-missing
          sha256sum -c geoip.dat.sha256sum --ignore-missing
          sha256sum -c geosite.dat.sha256sum --ignore-missing
          rm -f *.sha256sum

      - name: Build nekobox_core
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/go/cmd/nekobox_core"
          go build -o "$GITHUB_WORKSPACE/deployment/windows64/nekobox_core.exe" \
            -trimpath \
            -ldflags "-w -s -X github.com/matsuridayo/libneko/neko_common.Version_neko=nekoray-${{ env.NEKO_VERSION }} -X github.com/sagernet/sing-box/constant.Version=${{ env.SING_BOX_VERSION }}" \
            -tags "with_clash_api,with_gvisor,with_quic,with_wireguard,with_utls,with_grpc"

      - name: Build sing-box CLI (custom core)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/../sing-box"
          go build -o "$GITHUB_WORKSPACE/deployment/windows64/sing-box.exe" ./cmd/sing-box

      - name: Build updater
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/go/cmd/updater"
          go build -o "$GITHUB_WORKSPACE/deployment/windows64/updater.exe" .

      - name: MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Qt 6.8.3 (MSVC 2022)
        shell: bash
        run: |
          python -m pip install --quiet --upgrade aqtinstall
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 \
            --outputdir "$GITHUB_WORKSPACE/qt"
          QTP=$(find "$GITHUB_WORKSPACE/qt" -name Qt6Config.cmake -path "*/lib/cmake/Qt6/Qt6Config.cmake" | head -1 | sed 's|/lib/cmake/Qt6/Qt6Config.cmake||')
          if [ -z "$QTP" ]; then echo "QT6 NOT DETECTED, layout:"; find "$GITHUB_WORKSPACE/qt" -maxdepth 3 -type d 2>/dev/null | head -20; exit 1; fi
          echo "Qt6 detected at: $QTP"
          echo "QT_ROOT=$QTP" >> "$GITHUB_ENV"
          echo "$QTP/bin" >> "$GITHUB_PATH"
          echo "Qt6_DIR=$QTP/lib/cmake/Qt6" >> "$GITHUB_ENV"

      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: $GITHUB_WORKSPACE/deps/built
          key: neko-deps-${{ runner.os }}-v2

      - name: Build deps (protobuf / yaml-cpp / zxing-cpp)
        shell: bash
        run: |
          python -m pip install --quiet ninja
          DEPS="$GITHUB_WORKSPACE/deps"
          mkdir -p "$DEPS/src" "$DEPS/built"
          git clone --depth 1 -b v21.12 https://github.com/protocolbuffers/protobuf.git "$DEPS/src/protobuf"
          cmake -GNinja -S "$DEPS/src/protobuf" -B "$DEPS/build-protobuf" \
            -DCMAKE_INSTALL_PREFIX="$DEPS/built" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -Dprotobuf_MSVC_STATIC_RUNTIME=OFF -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_SHARED_LIBS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$DEPS/build-protobuf" -j2 --target install
          git clone --depth 1 -b yaml-cpp-0.7.0 https://github.com/jbeder/yaml-cpp.git "$DEPS/src/yaml-cpp"
          cmake -GNinja -S "$DEPS/src/yaml-cpp" -B "$DEPS/build-yaml" \
            -DCMAKE_INSTALL_PREFIX="$DEPS/built" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DYAML_CPP_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$DEPS/build-yaml" -j4 --target install
          git clone --depth 1 -b v2.0.0 https://github.com/nu-book/zxing-cpp.git "$DEPS/src/zxing-cpp"
          cmake -GNinja -S "$DEPS/src/zxing-cpp" -B "$DEPS/build-zxing" \
            -DCMAKE_INSTALL_PREFIX="$DEPS/built" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BLACKBOX_TESTS=OFF
          cmake --build "$DEPS/build-zxing" -j4 --target install
          echo "DEPS_ROOT=$DEPS/built" >> "$GITHUB_ENV"

      - name: Configure & build GUI (nekobox.exe)
        shell: bash
        run: |
          mkdir -p build
          cd build
          cmake -GNinja -DQT_VERSION_MAJOR=6 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT;$DEPS_ROOT" -DQt6_DIR="$QT_ROOT/lib/cmake/Qt6" ..
          ninja -j4
          cp NekoBoxPro.exe "$GITHUB_WORKSPACE/deployment/windows64/"

      - name: Deploy Qt runtime (windeployqt)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/deployment/windows64"
          windeployqt --release --no-translations --no-system-d3d-compiler \
            --no-opengl-sw --no-compiler-runtime NekoBoxPro.exe
          cp "$QT_ROOT/translations/qtbase_zh_CN.qm" .

      - name: Package zip (exclude user config)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/deployment/windows64"
          rm -rf config stderr.txt nekobox.png
          "C:/Program Files/7-Zip/7z.exe" a -tzip -mx5 "$GITHUB_WORKSPACE/NekoBoxPro-Windows64.zip" ./*

      - name: Sign release asset (minisign)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          NEKO_MINISIGN_SECRET_KEY: ${{ secrets.NEKO_MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$NEKO_MINISIGN_SECRET_KEY" ]; then
            echo "::warning::NEKO_MINISIGN_SECRET_KEY 未配置，跳过签名。updater 将对无签名更新拒绝执行（fail-closed）。"
            exit 0
          fi
          printf '%s\n' "$NEKO_MINISIGN_SECRET_KEY" > /tmp/nekobox.key
          cd "$GITHUB_WORKSPACE/go/cmd/signasset"
          go build -o "$GITHUB_WORKSPACE/signasset-bin" .
          cd "$GITHUB_WORKSPACE"
          ./signasset-bin /tmp/nekobox.key NekoBoxPro-Windows64.zip
          rm -f /tmp/nekobox.key signasset-bin*

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nekobox-windows64
          path: |
            NekoBoxPro-Windows64.zip
            NekoBoxPro-Windows64.zip.minisig

      - name: Publish GitHub Release (Windows)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            NekoBoxPro-Windows64.zip
            NekoBoxPro-Windows64.zip.minisig
          body: |
            **NekoBoxPro v${{ env.NEKO_VERSION }}** 已发布 / Released.

            单内核 sing-box 客户端 · 稳定优先 · 最小复杂度

            更新日志 / Changelog: https://github.com/NekoBoxHQ/NekoBoxPro/releases

      - name: Notify Telegram Group
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(printf '<b>NekoBoxPro v%s 已发布</b>\n\n🔧 内核: sing-box v%s\n🖥️ 平台: Windows / Linux\n🔗 项目: %s' \
            "${{ env.NEKO_VERSION }}" \
            "${{ env.SING_BOX_VERSION }}" \
            "https://github.com/NekoBoxHQ/NekoBoxPro")
          curl -s -m 30 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML"

  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # 仅发布 GitHub Release 需要
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.5'
          cache: true

      - name: Clone kernel dependencies (libneko & sing-box fork)
        shell: bash
        run: |
          # 依赖 fork 已公开（GPLv3 源码可得），无需凭据，按固定 commit 克隆
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/NekoBoxHQ/libneko.git libneko
          git -C libneko fetch --depth 1 origin "${{ env.LIB_NEKO_COMMIT }}"
          git -C libneko checkout "${{ env.LIB_NEKO_COMMIT }}"
          git clone --depth 1 https://github.com/NekoBoxHQ/sing-box.git sing-box
          git -C sing-box fetch --depth 1 origin "${{ env.SING_BOX_COMMIT }}"
          git -C sing-box checkout "${{ env.SING_BOX_COMMIT }}"

      - name: Download geo data (pinned versions, sha256 verified)
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/deployment/linux64"
          cd "$GITHUB_WORKSPACE/deployment/linux64"
          set -e
          curl -fLso geoip.db "https://github.com/SagerNet/sing-geoip/releases/download/${{ env.GEOIP_DB_VER }}/geoip.db"
          curl -fLso geosite.db "https://github.com/SagerNet/sing-geosite/releases/download/${{ env.GEOSITE_DB_VER }}/geosite.db"
          curl -fLso geoip.dat "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${{ env.GEOIP_DAT_VER }}/geoip.dat"
          curl -fLso geosite.dat "https://github.com/v2fly/domain-list-community/releases/download/${{ env.GEOSITE_DAT_VER }}/dlc.dat"
          curl -fsSL "https://github.com/SagerNet/sing-geoip/releases/download/${{ env.GEOIP_DB_VER }}/geoip.db.sha256sum" -o geoip.db.sha256sum
          curl -fsSL "https://github.com/SagerNet/sing-geosite/releases/download/${{ env.GEOSITE_DB_VER }}/geosite.db.sha256sum" -o geosite.db.sha256sum
          curl -fsSL "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${{ env.GEOIP_DAT_VER }}/geoip.dat.sha256sum" -o geoip.dat.sha256sum
          curl -fsSL "https://github.com/v2fly/domain-list-community/releases/download/${{ env.GEOSITE_DAT_VER }}/dlc.dat.sha256sum" -o geosite.dat.sha256sum
          sed -i 's/dlc\.dat/geosite.dat/' geosite.dat.sha256sum
          sha256sum -c geoip.db.sha256sum --ignore-missing
          sha256sum -c geosite.db.sha256sum --ignore-missing
          sha256sum -c geoip.dat.sha256sum --ignore-missing
          sha256sum -c geosite.dat.sha256sum --ignore-missing
          rm -f *.sha256sum

      - name: Build nekobox_core
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/go/cmd/nekobox_core"
          go build -o "$GITHUB_WORKSPACE/deployment/linux64/nekobox_core" \
            -trimpath \
            -ldflags "-w -s -X github.com/matsuridayo/libneko/neko_common.Version_neko=nekoray-${{ env.NEKO_VERSION }} -X github.com/sagernet/sing-box/constant.Version=${{ env.SING_BOX_VERSION }}" \
            -tags "with_clash_api,with_gvisor,with_quic,with_wireguard,with_utls,with_grpc"

      - name: Build sing-box CLI (custom core)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/../sing-box"
          go build -o "$GITHUB_WORKSPACE/deployment/linux64/sing-box" ./cmd/sing-box

      - name: Build updater
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/go/cmd/updater"
          go build -o "$GITHUB_WORKSPACE/deployment/linux64/updater" .

      - name: Setup Python 3.12 (for aqtinstall)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Qt 6.7.2 (Linux gcc_64)
        shell: bash
        run: |
          python -m pip install --quiet --upgrade aqtinstall
          aqt install-qt linux desktop 6.7.2 linux_gcc_64 --outputdir "$GITHUB_WORKSPACE/qt"
          QTP=$(find "$GITHUB_WORKSPACE/qt" -name Qt6Config.cmake -path "*/lib/cmake/Qt6/Qt6Config.cmake" | head -1 | sed 's|/lib/cmake/Qt6/Qt6Config.cmake||')
          if [ -z "$QTP" ]; then echo "QT6 NOT DETECTED, layout:"; find "$GITHUB_WORKSPACE/qt" -maxdepth 3 -type d 2>/dev/null | head -20; exit 1; fi
          echo "Qt6 detected at: $QTP"
          echo "Qt6_DIR=$QTP/lib/cmake/Qt6" >> "$GITHUB_ENV"

      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: $GITHUB_WORKSPACE/deps/built
          key: neko-deps-${{ runner.os }}-v2

      - name: Build deps (protobuf / yaml-cpp / zxing-cpp)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          DEPS="$GITHUB_WORKSPACE/deps"
          mkdir -p "$DEPS/src" "$DEPS/built"
          git clone --depth 1 -b v21.12 https://github.com/protocolbuffers/protobuf.git "$DEPS/src/protobuf"
          cmake -GNinja -S "$DEPS/src/protobuf" -B "$DEPS/build-protobuf" \
            -DCMAKE_INSTALL_PREFIX="$DEPS/built" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -Dprotobuf_MSVC_STATIC_RUNTIME=OFF -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_SHARED_LIBS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$DEPS/build-protobuf" -j2 --target install
          git clone --depth 1 -b yaml-cpp-0.7.0 https://github.com/jbeder/yaml-cpp.git "$DEPS/src/yaml-cpp"
          cmake -GNinja -S "$DEPS/src/yaml-cpp" -B "$DEPS/build-yaml" \
            -DCMAKE_INSTALL_PREFIX="$DEPS/built" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DYAML_CPP_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$DEPS/build-yaml" -j4 --target install
          git clone --depth 1 -b v2.0.0 https://github.com/nu-book/zxing-cpp.git "$DEPS/src/zxing-cpp"
          cmake -GNinja -S "$DEPS/src/zxing-cpp" -B "$DEPS/build-zxing" \
            -DCMAKE_INSTALL_PREFIX="$DEPS/built" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BLACKBOX_TESTS=OFF
          cmake --build "$DEPS/build-zxing" -j4 --target install
          echo "DEPS_ROOT=$DEPS/built" >> "$GITHUB_ENV"

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-xv0 libdbus-1-3 libegl1 libfontconfig1 libfreetype6 \
            libglib2.0-0 libharfbuzz0b libx11-6 libx11-xcb1 libxext6 libxfixes3 \
            libxi6 libxrender1 libsm6 libice6 libssl3 libxkbcommon0 libwayland-client0

      - name: Configure & build GUI (nekobox)
        shell: bash
        run: |
          mkdir -p build
          cd build
          cmake -GNinja -DQT_VERSION_MAJOR=6 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR/../../..;$DEPS_ROOT" ..
          ninja -j4
          cp nekoboxpro "$GITHUB_WORKSPACE/deployment/linux64/"

      - name: Stage runtime assets
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/deployment/linux64"
          cp "$GITHUB_WORKSPACE/res/public/nekobox.png" .

      - name: Build AppImage
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          export PATH="$Qt6_DIR/../../bin:$PATH"
          export QMAKE="$Qt6_DIR/../../bin/qmake"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          printf '[Desktop Entry]\nType=Application\nName=NekoBoxPro\nComment=NekoBoxPro proxy client\nExec=nekoboxpro\nIcon=nekobox\nCategories=Network;Qt;\nTerminal=false\n' > AppDir/usr/share/applications/nekobox.desktop
          cp res/public/nekobox.png AppDir/usr/share/icons/hicolor/256x256/apps/nekobox.png
          export LDAI_OUTPUT="NekoBoxPro-Linux-x64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable deployment/linux64/nekoboxpro \
            --plugin qt \
            --output appimage

      - name: Package tar.gz
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/deployment"
          rm -rf linux64/config
          mv linux64 nekoboxpro
          tar czf "$GITHUB_WORKSPACE/NekoBoxPro-Linux64.tar.gz" nekoboxpro

      - name: Sign release assets (minisign)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          NEKO_MINISIGN_SECRET_KEY: ${{ secrets.NEKO_MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$NEKO_MINISIGN_SECRET_KEY" ]; then
            echo "::warning::NEKO_MINISIGN_SECRET_KEY 未配置，跳过签名。updater 将对无签名更新拒绝执行（fail-closed）。"
            exit 0
          fi
          printf '%s\n' "$NEKO_MINISIGN_SECRET_KEY" > /tmp/nekobox.key
          cd "$GITHUB_WORKSPACE/go/cmd/signasset"
          go build -o "$GITHUB_WORKSPACE/signasset-bin" .
          cd "$GITHUB_WORKSPACE"
          ./signasset-bin /tmp/nekobox.key NekoBoxPro-Linux-x64.AppImage
          ./signasset-bin /tmp/nekobox.key NekoBoxPro-Linux64.tar.gz
          rm -f /tmp/nekobox.key signasset-bin*

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nekobox-linux64
          path: |
            NekoBoxPro-Linux-x64.AppImage
            NekoBoxPro-Linux-x64.AppImage.minisig
            NekoBoxPro-Linux64.tar.gz
            NekoBoxPro-Linux64.tar.gz.minisig

      - name: Publish GitHub Release (Linux)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            NekoBoxPro-Linux-x64.AppImage
            NekoBoxPro-Linux-x64.AppImage.minisig
            NekoBoxPro-Linux64.tar.gz
            NekoBoxPro-Linux64.tar.gz.minisig
